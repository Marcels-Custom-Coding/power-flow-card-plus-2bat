<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Drei Varianten für zwei Batterien: Sammelschiene, Knotenpunkt, Batterie-Gruppe</title>
  <style>
    .panel { fill: none; stroke: #8b949e; stroke-opacity: 0.35; }
    .line { fill: none; stroke-width: 1.5; }
    .grid { stroke: #8353d1; }
    .solar { stroke: #f06292; }
    .home { stroke: #4db6ac; }
    .battery { fill: none; stroke: #4db6ac; stroke-width: 2; }
    .hub { stroke: #8b949e; }
    .value { fill: #8b949e; font-size: 13px; text-anchor: middle; }
    .name { fill: #8b949e; font-size: 11px; text-anchor: middle; }
    .caption { fill: #8b949e; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .hint { fill: #8b949e; font-size: 12px; text-anchor: middle; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>

  <g transform="translate(10,10)">
    <rect class="panel" x="0" y="0" width="220" height="300" rx="14"/>
    <g transform="translate(0,10)">
      <text class="name" x="8" y="33" text-anchor="start" style="text-anchor:start">Netz</text>
      <text class="name" x="116" y="10" style="text-anchor:start">PV</text>
      <text class="name" x="212" y="33" style="text-anchor:end">Haus</text>
      <path class="line grid" d="M0,40 H58 C82,40 96,52 96,80 V115"/>
      <path class="line solar" d="M110,0 V115"/>
      <path class="line home" d="M220,40 H162 C138,40 124,52 124,80 V115"/>
      <line x1="86" y1="117" x2="134" y2="117" class="hub" stroke-width="4" stroke-linecap="round"/>
      <path class="line home" d="M98,119 C98,136 62,132 62,150"/>
      <path class="line home" d="M122,119 C122,136 158,132 158,150"/>
      <circle r="2.5" fill="#f06292"><animateMotion dur="2.4s" repeatCount="indefinite" path="M110,0 V115"/></circle>
      <circle r="2.5" fill="#4db6ac"><animateMotion dur="2.6s" repeatCount="indefinite" path="M124,115 V80 C124,52 138,40 162,40 H220"/></circle>
      <circle r="2.5" fill="#4db6ac"><animateMotion dur="1.6s" repeatCount="indefinite" path="M62,150 C62,132 98,136 98,119"/></circle>
      <circle r="2.5" fill="#f06292"><animateMotion dur="1.8s" repeatCount="indefinite" path="M122,119 C122,136 158,132 158,150"/></circle>
      <circle class="battery" cx="62" cy="180" r="30"/>
      <circle class="battery" cx="158" cy="180" r="30"/>
      <text class="value" x="62" y="178">96 %</text><text class="name" x="62" y="194">BYD</text>
      <text class="value" x="158" y="178">91 %</text><text class="name" x="158" y="194">Venus</text>
    </g>
    <text class="caption" x="110" y="252">A · Sammelschiene</text>
    <text class="hint" x="110" y="276">split_style: bus</text>
  </g>

  <g transform="translate(250,10)">
    <rect class="panel" x="0" y="0" width="220" height="300" rx="14"/>
    <g transform="translate(0,10)">
      <text class="name" x="8" y="33" text-anchor="start" style="text-anchor:start">Netz</text>
      <text class="name" x="116" y="10" style="text-anchor:start">PV</text>
      <text class="name" x="212" y="33" style="text-anchor:end">Haus</text>
      <path class="line grid" d="M0,40 H58 C82,40 96,52 96,80 V96 C96,108 103,110 104,114"/>
      <path class="line solar" d="M110,0 V111"/>
      <path class="line home" d="M220,40 H162 C138,40 124,52 124,80 V96 C124,108 117,110 116,114"/>
