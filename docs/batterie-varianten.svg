      <circle cx="110" cy="120" r="3" fill="#4db6ac"/>
      <path class="line home" d="M106,127 C102,142 62,132 62,150"/>
      <path class="line home" d="M114,127 C118,142 158,132 158,150"/>
      <circle r="2.5" fill="#f06292"><animateMotion dur="2.4s" repeatCount="indefinite" path="M110,0 V111"/></circle>
      <circle r="2.5" fill="#4db6ac"><animateMotion dur="2.6s" repeatCount="indefinite" path="M116,114 C117,110 124,108 124,96 V80 C124,52 138,40 162,40 H220"/></circle>
      <circle r="2.5" fill="#4db6ac"><animateMotion dur="1.6s" repeatCount="indefinite" path="M62,150 C62,132 102,142 106,127"/></circle>
      <circle r="2.5" fill="#f06292"><animateMotion dur="1.8s" repeatCount="indefinite" path="M114,127 C118,142 158,132 158,150"/></circle>
      <circle class="battery" cx="62" cy="180" r="30"/>
      <circle class="battery" cx="158" cy="180" r="30"/>
      <text class="value" x="62" y="178">96 %</text><text class="name" x="62" y="194">BYD</text>
      <text class="value" x="158" y="178">91 %</text><text class="name" x="158" y="194">Venus</text>
    </g>
    <text class="caption" x="110" y="252">B · Knotenpunkt</text>
    <text class="hint" x="110" y="276">split_style: node</text>
  </g>

  <g transform="translate(490,10)">
    <rect class="panel" x="0" y="0" width="220" height="300" rx="14"/>
    <g transform="translate(0,10)">
      <text class="name" x="8" y="33" text-anchor="start" style="text-anchor:start">Netz</text>
      <text class="name" x="116" y="10" style="text-anchor:start">PV</text>
      <text class="name" x="212" y="33" style="text-anchor:end">Haus</text>
      <path class="line grid" d="M0,40 H58 C82,40 96,52 96,80 V92 C96,108 110,108 110,124"/>
      <path class="line solar" d="M110,0 V124"/>
      <path class="line home" d="M220,40 H162 C138,40 124,52 124,80 V92 C124,108 110,108 110,124"/>
      <rect x="20" y="124" width="180" height="88" rx="44" fill="none" stroke="#4db6ac" stroke-opacity="0.6" stroke-width="1.5"/>
      <circle r="2.5" fill="#f06292"><animateMotion dur="2.4s" repeatCount="indefinite" path="M110,0 V124"/></circle>
      <circle r="2.5" fill="#4db6ac"><animateMotion dur="2.8s" repeatCount="indefinite" path="M110,124 C110,108 124,108 124,92 V80 C124,52 138,40 162,40 H220"/></circle>
      <circle class="battery" cx="68" cy="168" r="30"/>
      <circle class="battery" cx="152" cy="168" r="30"/>
      <text class="value" x="68" y="166">96 %</text><text class="name" x="68" y="182">BYD</text>
      <text class="value" x="152" y="166">91 %</text><text class="name" x="152" y="182">Venus</text>
    </g>
    <text class="caption" x="110" y="252">C · Batterie-Gruppe</text>
    <text class="hint" x="110" y="276">split_style: group · Standard</text>
